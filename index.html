<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Services Dropdown Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root{--navy:#15202A;--ink:#181515;--lime:#9EC837;--lime-deep:#5E7F12;--red:#E0473F;--paper:#fff;--mist:#F2F4EF;--line:#E2E6DC;--muted:#5D6570;--display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#0D1720;color:var(--ink);font:15px/1.5 var(--body)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* Preview controls: not part of the component */
.review{background:var(--mist);padding-block:10px}
.review .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--muted)}
.review strong{color:var(--ink);font-weight:600}
.review label{display:inline-flex;gap:7px;align-items:center;cursor:pointer;color:var(--ink);font-weight:500;min-height:32px}
.review input{width:16px;height:16px;margin:0;accent-color:var(--lime-deep)}

/* Mock of the site header, for context only */
.hero{min-height:calc(100vh - 53px);color:var(--paper);background:radial-gradient(900px 420px at 78% 105%,rgba(255,178,84,.22),transparent 62%),linear-gradient(180deg,#0D1720,#15232F 55%,#1C2C39)}
.bar{position:relative;display:flex;align-items:center;gap:24px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;flex-shrink:0}
.logo b{font:600 22px var(--display);letter-spacing:-.01em}
.logo i{font:600 11px var(--display);letter-spacing:.14em;background:var(--lime);color:var(--ink);padding:3px 7px;border-radius:4px}
.menus{display:flex;align-items:stretch;align-self:stretch;list-style:none;margin:0 0 0 auto;padding:0}
.menus>li{display:flex}
.navbtn{appearance:none;background:none;border:0;color:inherit;font:500 13px var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:0 9px;cursor:pointer;position:relative;text-decoration:none}
.navbtn::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:3px;background:var(--lime);transform:scaleX(0);transition:transform .18s ease}
.navbtn:hover::after,.navbtn[aria-expanded=true]::after{transform:scaleX(1)}
.caret{width:10px;height:10px;transition:transform .18s ease;flex-shrink:0}
[aria-expanded=true]>.caret{transform:rotate(180deg)}
.ctas{display:flex;gap:10px;flex-shrink:0}
.btn{font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:11px 16px;text-decoration:none;white-space:nowrap;border:2px solid var(--red);color:var(--paper)}
.btn.book{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.burger{display:none;margin-left:auto;appearance:none;background:none;border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:6px;width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer}
.hero h2{font:500 clamp(34px,5vw,56px)/1.05 var(--display);margin:0;padding-block:96px;max-width:14ch}

/* ===== Services dropdown: the component ===== */
.svc-panel{position:absolute;top:100%;z-index:20;width:780px;max-width:100%;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;max-height:min(440px,calc(100vh - var(--svc-top,0px) - 16px));background:var(--paper);color:var(--ink);border-top:3px solid var(--lime);border-radius:0 0 12px 12px;box-shadow:0 24px 48px -12px rgba(9,16,22,.45);overflow:hidden}
.svc-rail{background:var(--mist);padding:8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.svc-tab{appearance:none;border:0;background:none;text-align:left;font:500 14px/1.25 var(--body);color:var(--ink);padding:9px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.svc-tab svg{width:10px;height:10px;opacity:0;flex-shrink:0;color:var(--lime-deep)}
.svc-tab:hover{background:#E7EBE1}
.svc-tab[aria-selected=true]{background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgba(9,16,22,.08)}
.svc-tab[aria-selected=true] svg{opacity:1}
.svc-list{overflow-y:auto;padding:10px 12px;min-height:0}
.svc-items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 8px;align-content:start}
.svc-link{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 10px;border-radius:6px;font-size:14px;line-height:1.25;font-weight:500;color:var(--ink);text-decoration:none}
a.svc-link:hover{background:var(--mist);color:var(--lime-deep)}
.svc-link.planned{color:var(--muted);font-weight:400}
.svc-link.planned::before{content:"";width:7px;height:7px;flex-shrink:0;border-radius:50%;border:1.5px dashed #8A929B}
.svc-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.svc-foot a{font-weight:600;color:var(--lime-deep);text-decoration:none}
.svc-foot a:hover{text-decoration:underline}
.svc-foot a[href^=tel]{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Phone and tablet: tappable list inside the menu drawer */
.drawer{background:var(--paper);color:var(--ink);border-top:3px solid var(--lime);padding-block:6px 14px}
.drawer details{border-bottom:1px solid var(--line)}
.drawer details details:last-of-type{border-bottom:0}
.drawer summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:600;font-size:15px;cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer details[open]>summary .caret{transform:rotate(180deg)}
.drawer .svc-items{grid-template-columns:1fr;padding-bottom:8px}
.drawer .svc-link{padding-inline:0;min-height:44px}
.drawer .all{display:flex;align-items:center;min-height:48px;font-weight:600;color:var(--lime-deep);text-decoration:none}
@media (max-width:1180px){.menus,.ctas{display:none}.burger{display:inline-flex}}
@media (min-width:1181px){.drawer{display:none}}
@media (max-width:760px){.hero h2{padding-block:56px}}
@media (prefers-reduced-motion:reduce){.navbtn::after,.caret{transition:none}}
</style>
</head>
<body>
<div class="review"><div class="wrap">
  <span><strong id="nLive"></strong> live · <strong id="nPlanned"></strong> planned</span>
  <label><input type="checkbox" id="showPlanned" checked> Show planned pages</label>
  <span>Turn this off to see what visitors get today.</span>
</div></div>
<header class="hero">
  <div class="wrap">
    <div class="bar" id="bar">
      <a class="logo" href="https://www.highlightschicago.com/" aria-label="Highlights Chicago home"><b>Highlights</b><i>CHICAGO</i></a>
      <ul class="menus">
        <li><a class="navbtn" href="https://www.highlightschicago.com/">Home</a></li>
        <li><a class="navbtn" href="https://www.highlightschicago.com/about-us">About us</a></li>
        <li id="svcLi">
          <button class="navbtn" id="svcBtn" aria-expanded="false" aria-controls="svcPanel">Services<svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="svc-panel" id="svcPanel" hidden>
            <div class="svc-rail" id="svcRail" role="tablist" aria-orientation="vertical" aria-label="Service categories"></div>
            <div class="svc-list" id="svcList" role="tabpanel" tabindex="-1"></div>
            <div class="svc-foot"><span>Not sure what you need? Call <a href="tel:+17732623333">773-262-3333</a></span><a href="https://www.highlightschicago.com/services">See all services →</a></div>
          </div>
        </li>
        <li><a class="navbtn" href="https://www.highlightschicago.com/service-areas">Service Areas</a></li>
        <li><a class="navbtn" href="https://www.highlightschicago.com/reviews">Reviews</a></li>
        <li><a class="navbtn" href="https://www.highlightschicago.com/blog">Blog</a></li>
        <li><a class="navbtn" href="https://www.highlightschicago.com/learning-center">Learning Center</a></li>
      </ul>
      <div class="ctas"><a class="btn" href="tel:+17732623333">24/7 Emergency</a><a class="btn book" href="https://www.highlightschicago.com/contact-us">Book Now</a></div>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="drawer" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </div>
  <div class="drawer" id="drawer" hidden><div class="wrap" id="drawerInner"></div></div>
  <div class="wrap"><h2>We Keep Chicago Lit!</h2></div>
</header>
<script>
// [name, path under /services/ (live) or planned slug, live?]. When a page goes live: set the third value to 1 and use its full path.
const TABS = [{"name": "Panels & Power", "items": [["Circuit Breaker Replacement", "circuit-protection/circuit-breaker-replacement", 1], ["Panel Upgrade", "panel-upgrades/electrical-panel-upgrade", 1], ["Whole-House Surge Protector", "circuit-protection/whole-house-surge-protector", 1], ["Panel Replacement", "electrical-panel-replacement-near-me", 0], ["Panel Repair & Maintenance", "circuit-protection/breaker-box-and-panel-repair", 1], ["Panel Installation", "electrical-panel-installation-near-me", 0], ["Grounding & Bonding", "circuit-protection/grounding-and-bonding", 1], ["100 to 200 Amp Service Upgrade", "electrical-service-upgrade-near-me", 0], ["Fuse Box Replacement", "fuse-box-replacement", 0], ["Electric Meter & Meter Socket", "meter-socket-replacement-near-me", 0]]}, {"name": "Wiring & Repairs", "items": [["Electrical Repair", "electrical-wiring/electrical-repair", 1], ["Electrical Troubleshooting", "electrical-wiring/electrical-troubleshooting", 1], ["Electrical Safety Inspection", "electrical-inspection-near-me", 0], ["Whole-House Rewiring", "whole-house-rewiring-near-me", 0], ["Wiring Repair", "electrical-wiring/electrical-wiring-and-repair-services", 1], ["Electrical Installation", "electrical-wiring/electrical-installation-services", 1], ["New Construction Wiring", "new-construction-electrician-near-me", 0], ["Infrared / Thermal Inspection", "solar-energy/infrared-electrical-inspection", 1], ["New & Dedicated Circuits", "dedicated-circuit-installation-near-me", 0], ["Garage Wiring", "garage-wiring-near-me", 0], ["Electrical Permits", "electrical-permits-near-me", 0], ["Code Violation Correction", "electrical-code-compliance-near-me", 0], ["Remodel Wiring", "remodel-electrical-wiring-near-me", 0], ["Junction Boxes", "junction-box-installation-near-me", 0]]}, {"name": "Outlets & Switches", "items": [["GFCI Outlets", "electrical-outlets/gfci-outlet-installation", 1], ["Outlet Repair & Replacement", "outlet-replacement-near-me", 0], ["Outlet Installation", "electrical-outlets/electrical-outlet-installation", 1], ["Light Switches", "electrical-outlets/light-switch-replacement-and-installation", 1], ["Dimmer Switches", "electrical-outlets/dimmer-switch-installation-and-replacement", 1], ["Smart Switches & Motion Sensors", "smart-switch-installation-near-me", 0]]}, {"name": "Lighting", "items": [["Outdoor & Security Lighting", "outdoor-lighting/outdoor-lighting-installation", 1], ["Recessed Lighting", "interior-lighting/recessed-lighting-installation", 1], ["Landscape Lighting", "outdoor-lighting/landscape-lighting-installation", 1], ["Light Fixtures", "interior-lighting/light-fixture-installation-and-replacement", 1], ["Chandeliers", "interior-lighting/chandelier-installation", 1], ["LED Retrofit & Upgrades", "interior-lighting/led-retrofit", 1], ["Under-Cabinet Lighting", "under-cabinet-lighting-installation-near-me", 0], ["Smart Lighting & Controls", "smart-lighting-installation-near-me", 0], ["Track Lighting", "track-lighting-installation-near-me", 0], ["Pendant Lighting", "pendant-light-installation-near-me", 0], ["Wall Sconces", "wall-sconce-installation-near-me", 0]]}, {"name": "EV Charging", "items": [["Home & Tesla Charger Installation", "ev-charging/tesla-and-ev-charger-installation", 1], ["Commercial & Multi-Unit EV Charging", "commercial-ev-charger-installation-near-me", 0], ["EV Charger Repair & Maintenance", "ev-charger-repair-near-me", 0]]}, {"name": "Emergency & Safety", "items": [["24/7 Emergency Electrician", "emergency-electrician-near-me", 0], ["Fire Alarm Systems", "life-safety/fire-alarm-installation", 1], ["Smoke Detectors", "life-safety/smoke-detector-installation-and-wiring", 1], ["Carbon Monoxide Detectors", "life-safety/carbon-monoxide-detector-installation", 1], ["Same-Day & After-Hours", "same-day-electrician-near-me", 0], ["Power Outages & Hazards", "power-outage-electrician-near-me", 0]]}, {"name": "Generators & Solar", "items": [["Generator Installation", "generator-installation", 0], ["Solar Panel Installation", "solar-panel-installation", 0], ["Generator Repair", "generator-repair", 0], ["Home Energy Audit", "home-energy-audit", 0], ["Solar Batteries", "solar-battery-installation", 0], ["ENERGY STAR Appliance Wiring", "energy-star-appliances", 0], ["Energy Efficiency Upgrades", "energy-efficiency-upgrades", 0], ["Solar Inverters", "solar-energy/solar-inverter-installation", 1]]}, {"name": "Appliances & Fans", "items": [["Ceiling Fans", "ceiling-fan-installation", 0], ["Garbage Disposal Wiring", "garbage-disposal-wiring", 0], ["Bathroom Exhaust Fans", "bathroom-exhaust-fan-installation", 0], ["Well Pump & Water Heater Wiring", "appliance-circuits/well-pump-wiring", 1], ["Furnace & AC Electrical", "furnace-and-ac-electrical-near-me", 0]]}, {"name": "Low Voltage & AV", "items": [["Structured Cabling", "structured-cabling-installation", 0], ["Low Voltage Wiring", "low-voltage-wiring-installation", 0], ["CCTV & Security Cameras", "cctv-installation", 0], ["Fiber Optic Cable", "fiber-optic-cable-installation", 0], ["AV Installation", "low-voltage/av-installation-services", 1]]}, {"name": "Commercial", "items": [["Commercial Lighting", "commercial-lighting-installation-near-me", 0], ["Facility Electrical Maintenance", "electrical-maintenance-services-near-me", 0], ["Parking Lot & Garage Lighting", "outdoor-lighting/parking-lot-lighting-repair-and-installation", 1], ["Emergency Lighting", "outdoor-lighting/emergency-lighting-services-and-maintenance", 1], ["Exit Signs & Egress Lighting", "exit-sign-installation-near-me", 0], ["Warehouse & High-Bay Lighting", "warehouse-lighting-installation-near-me", 0], ["Industrial Machinery & Motor Controls", "industrial-machinery-wiring-near-me", 0], ["Sign & Storefront Lighting", "sign-lighting-installation-near-me", 0], ["Restaurant & Kitchen Wiring", "restaurant-electrician-near-me", 0], ["Tenant Build-Out & Office Electrical", "office-electrical-installation-near-me", 0]]}];
const BASE = "https://www.highlightschicago.com/services/";
// Set to false on the live site: planned pages have no URL yet and would 404.
let showPlanned = true;
let active = 0;
let hoverT = null, tabT = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;");
const caret = '<svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrow = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const visible = () => TABS.map(t => ({ name: t.name, items: t.items.filter(i => showPlanned || i[2]) })).filter(t => t.items.length);
// Planned pages render as plain text, so nobody can click through to a 404.
const itemHTML = ([n, p, live]) => `<li>${live ? `<a class="svc-link" href="${BASE + p}">${esc(n)}</a>` : `<span class="svc-link planned" title="Planned page, not published yet">${esc(n)}</span>`}</li>`;

function renderList() {
  const tabs = visible();
  active = Math.min(active, tabs.length - 1);
  $("svcRail").querySelectorAll(".svc-tab").forEach((b, i) => {
    b.setAttribute("aria-selected", i === active);
    b.tabIndex = i === active ? 0 : -1;
  });
  const list = $("svcList");
  list.setAttribute("aria-labelledby", "svcTab" + active);
  list.innerHTML = `<ul class="svc-items">${tabs[active].items.map(itemHTML).join("")}</ul>`;
  list.scrollTop = 0;
}
function render() {
  const tabs = visible();
  $("svcRail").innerHTML = tabs.map((t, i) => `<button class="svc-tab" role="tab" id="svcTab${i}" data-i="${i}" aria-controls="svcList">${esc(t.name)}${arrow}</button>`).join("");
  renderList();
  $("drawerInner").innerHTML = `<details open><summary>Services${caret}</summary>${tabs.map(t => `<details><summary>${esc(t.name)}${caret}</summary><ul class="svc-items">${t.items.map(itemHTML).join("")}</ul></details>`).join("")}<a class="all" href="https://www.highlightschicago.com/services">See all services →</a></details>`;
  const all = TABS.flatMap(t => t.items);
  $("nLive").textContent = all.filter(i => i[2]).length;
  $("nPlanned").textContent = all.filter(i => !i[2]).length;
}
function place() {
  const p = $("svcPanel"), bar = $("bar"), r = bar.getBoundingClientRect();
  const left = $("svcBtn").getBoundingClientRect().left - r.left;
  p.style.left = Math.max(0, Math.min(left - 8, bar.clientWidth - p.offsetWidth)) + "px";
  p.style.setProperty("--svc-top", r.bottom + "px");
}
function setOpen(on) {
  $("svcPanel").hidden = !on;
  $("svcBtn").setAttribute("aria-expanded", on);
  if (on) place();
}
const isOpen = () => !$("svcPanel").hidden;
$("svcBtn").addEventListener("click", e => { e.stopPropagation(); clearTimeout(hoverT); setOpen(!isOpen()); });
if (matchMedia("(hover: hover)").matches) {
  $("svcLi").addEventListener("pointerenter", () => { clearTimeout(hoverT); hoverT = setTimeout(() => setOpen(true), 70); });
  $("svcLi").addEventListener("pointerleave", () => { clearTimeout(hoverT); hoverT = setTimeout(() => setOpen(false), 240); });
}
const rail = $("svcRail");
const pick = i => { active = i; renderList(); };
// A short delay stops the list flickering when the pointer crosses other tabs on its way to a link.
rail.addEventListener("pointerover", e => {
  const b = e.target.closest(".svc-tab"); if (!b) return;
  clearTimeout(tabT); tabT = setTimeout(() => pick(+b.dataset.i), 90);
});
rail.addEventListener("pointerleave", () => clearTimeout(tabT));
rail.addEventListener("click", e => { const b = e.target.closest(".svc-tab"); if (b) { clearTimeout(tabT); pick(+b.dataset.i); } });
rail.addEventListener("keydown", e => {
  const n = visible().length;
  const to = { ArrowDown: (active + 1) % n, ArrowUp: (active - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
  if (to !== undefined) { e.preventDefault(); pick(to); $("svcTab" + to).focus(); }
  if (e.key === "ArrowRight") { const a = $("svcList").querySelector("a"); if (a) { e.preventDefault(); a.focus(); } }
});
$("svcPanel").addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => isOpen() && setOpen(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && isOpen()) { setOpen(false); $("svcBtn").focus(); } });
addEventListener("resize", () => isOpen() && place());
$("showPlanned").addEventListener("change", e => { showPlanned = e.target.checked; render(); });
document.querySelector(".review").addEventListener("click", e => e.stopPropagation());
$("burger").addEventListener("click", () => {
  const d = $("drawer"); d.hidden = !d.hidden;
  $("burger").setAttribute("aria-expanded", !d.hidden);
  $("burger").setAttribute("aria-label", d.hidden ? "Open menu" : "Close menu");
});
render();
if (innerWidth > 1180) setOpen(true);
</script>
</body>
</html>
